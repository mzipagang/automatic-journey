    custom.8451.com/business_domain: "${K8S_LABEL_BUSINESS_DOMAIN}"
    custom.8451.com/product: "${K8S_LABEL_PRODUCT}"
    custom.8451.com/capability: "${K8S_LABEL_CAPABILITY}"
    custom.8451.com/team: "${K8S_LABEL_TEAM}"
    custom.8451.com/contact_product: "${K8S_LABEL_CONTACT_PRODUCT}"
    custom.8451.com/contact_team: "${K8S_LABEL_CONTACT_TEAM}"
    custom.8451.com/contact_technical: "${K8S_LABEL_CONTACT_TECHNICAL}"