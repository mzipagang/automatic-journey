global:
  environment:
    name: stg

reusable-api-chart:
  ingress:
    internal:
      domainName: map-onsite-apis.aks-ur-stg-internal.8451.cloud

  externalSecrets:
    enabled: true
    azureKeyVaults:
      primary:
        vaultUrl: https://kv-8451-map-stg.vault.azure.net/
      secondary:
        vaultUrl: https://kv-8451-onsite3p-stg.vault.azure.net/

  extraEnv:
    - name: "ENV"
      value: "stg"
    - name: "REDIS_HOST"
      value: "map-redis-cache-stg.redis.cache.windows.net"
    - name: "REDIS_PORT"
      value: "6380"
    - name: "REDIS_DB"
      value: "1"
    - name: "REDIS_SSL"
      value: "true"
    - name: "REDIS_SOCKET_TIMEOUT"
      value: "10"
    - name: "REDIS_SOCKET_CONNECT_TIMEOUT"
      value: "10"
